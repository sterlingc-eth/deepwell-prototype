<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="DeepWell Technology mark" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>DeepWell Technology</title>
  <style>
    .dv-ripple{opacity:0}
    svg:hover .dv-ripple{animation:dvRipple .7s cubic-bezier(.16,1,.3,1)}
    @keyframes dvRipple{from{opacity:.8;r:22px;stroke-width:4px}to{opacity:0;r:50px;stroke-width:.5px}}
    @media (prefers-reduced-motion: reduce){
      .dv-r{animation:none !important;stroke-dashoffset:0 !important}
      .dv-ripple{display:none}
    }
  </style>
  <g fill="none" stroke="#163C2C" stroke-width="4" stroke-linecap="round">
    <circle class="dv-r" cx="50" cy="50" r="10" stroke-dasharray="62.83" stroke-dashoffset="62.83">
      <animate attributeName="stroke-dashoffset" from="62.83" to="0" dur="0.5s" begin="0s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
    </circle>
    <circle class="dv-r" cx="50" cy="50" r="19" stroke-dasharray="119.38" stroke-dashoffset="119.38">
      <animate attributeName="stroke-dashoffset" from="119.38" to="0" dur="0.5s" begin="0.09s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
    </circle>
    <circle class="dv-r" cx="50" cy="50" r="28" stroke-dasharray="175.93" stroke-dashoffset="175.93">
      <animate attributeName="stroke-dashoffset" from="175.93" to="0" dur="0.5s" begin="0.18s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
    </circle>
    <circle class="dv-r" cx="50" cy="50" r="37" stroke-dasharray="232.48" stroke-dashoffset="232.48">
      <animate attributeName="stroke-dashoffset" from="232.48" to="0" dur="0.5s" begin="0.27s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
    </circle>
    <circle class="dv-r" cx="50" cy="50" r="46" stroke-dasharray="289.03" stroke-dashoffset="289.03">
      <animate attributeName="stroke-dashoffset" from="289.03" to="0" dur="0.5s" begin="0.36s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
    </circle>
  </g>
  <circle class="dv-ripple" cx="50" cy="50" r="22" fill="none" stroke="#B98A4E" stroke-width="4"/>
</svg>
